{% extends "base.html" %}
{% block title %}Create Account — Sikandar Furniture{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2 class="display">Create your account</h2>
    <p class="auth-sub">Save orders, addresses, and check out in seconds next time.</p>
    <form method="post" class="auth-form">
      <label>Full Name
        <input type="text" name="name" value="{{ name }}" required autofocus>
      </label>
      <label>Email
        <input type="email" name="email" value="{{ email }}" required>
      </label>
      <label>Password
        <input type="password" name="password" required minlength="6">
      </label>
      <button type="submit" class="btn btn-primary auth-submit">Sign Up</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</section>
{% endblock %}
