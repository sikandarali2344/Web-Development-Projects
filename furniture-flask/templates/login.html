{% extends "base.html" %}
{% block title %}Login — Sikandar Furniture{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2 class="display">Welcome back</h2>
    <p class="auth-sub">Login to track orders and check out faster.</p>
    <form method="post" class="auth-form">
      <label>Email
        <input type="email" name="email" value="{{ email }}" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn btn-primary auth-submit">Login</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
